name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
    - work
    paths:
    - .github/workflows/deploy-portfolio.yml
    - archetypes/**
    - assets/**
    - config/**
    - content/**
    - data/**
    - layouts/**
    - scripts/**
    - tests/**
    - static/**

  workflow_dispatch:

  schedule:
    # UTC: 00:17, 06:17, 12:17, 18:17 (JST: 09:17, 15:17, 21:17, 03:17).
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  deploy-portfolio:
    runs-on: ubuntu-24.04
    concurrency:
      group: portfolio-pages
      cancel-in-progress: true
    env:
      TZ: Asia/Tokyo
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        # Scheduled workflows run from the default branch, but publish work.
        ref: work
        submodules: true
        fetch-depth: 0
    - name: Install Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 0.128.2
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Restore external article cache
      uses: actions/cache@v5
      with:
        path: content/external
        key: external-articles-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          external-articles-
    - name: Test external article importer
      run: python3 -m unittest discover -s tests -v
    - name: Test game rules and video recording support
      run: node --test tests/*.test.mjs
    - name: Refresh Zenn and note articles
      run: python3 scripts/fetch_external_articles.py
    - name: Build Portfolio
      run: hugo --minify --environment production
    - name: Deploy Portfolio
      uses: peaceiris/actions-gh-pages@v4
      if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/work' }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: deploy
        publish_dir: ./public
